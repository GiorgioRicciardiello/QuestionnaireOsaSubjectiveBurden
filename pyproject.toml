[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "questionnaire-osa"
version         = "1.0.0"
description     = "Reproducible XGBoost + TabPFN benchmark for OSA severity classification."
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [
    { name = "Mount Sinai Sleep Research Group" }
]
keywords = [
    "obstructive sleep apnea", "polysomnography", "xgboost",
    "tabpfn", "shap", "machine-learning", "epidemiology",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core runtime dependencies (TabPFN is optional — see [project.optional-dependencies])
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "optuna>=3.4",
    "iterative-stratification>=0.1.7",
    "shap>=0.44",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
tabpfn = [
    "tabpfn>=2.5",
    "torch>=2.1",
]
dev = [
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.8",
]

[project.urls]
Homepage      = "https://github.com/mountsinai/QuestionnaireOsaSubjectiveBurden"
Documentation = "https://github.com/mountsinai/QuestionnaireOsaSubjectiveBurden#readme"
Issues        = "https://github.com/mountsinai/QuestionnaireOsaSubjectiveBurden/issues"

# ── setuptools layout ────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["src"]
include = ["questionnaire_osa*"]

# Make the top-level `config/` package importable too
[tool.setuptools]
package-dir = { "" = "src", "config" = "config" }

# ── Tooling ──────────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py310"]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]   # handled by black

[tool.mypy]
python_version           = "3.10"
warn_return_any          = true
warn_unused_configs      = true
disallow_untyped_defs    = false
ignore_missing_imports   = true
